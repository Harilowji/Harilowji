name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: .github/assets/metrics-stats.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Ho_Chi_Minh

      - name: Repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: .github/assets/metrics-repository.svg
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: Harilowji/OmniQuiz, Harilowji/BinBox, Harilowji/coursera-autopilot-pro, Harilowji/spotify-wallpaper-engine-sync

      - name: Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: .github/assets/metrics-activity.svg
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 0
          plugin_activity_filter: issue, pr, review, comment, push
